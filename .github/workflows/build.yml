name: Build Zoro EXE

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --icon="NONE" --add-data "commands.yaml;." --add-data "phrases;phrases" --hidden-import="vosk" --hidden-import="sounddevice" --hidden-import="soundfile" --hidden-import="yaml" --hidden-import="pycaw" --hidden-import="customtkinter" --hidden-import="pystray" --hidden-import="PIL" main.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zoro-Windows-App
          path: dist/main/
